function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const woodTex = canvasTex(512, 512, (g, w, h) => {
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -((r * 97) % 256);
    while (x < w) {
      const len = 256 + ((r * 53 + x) % 3) * 48;
      g.fillStyle = `hsl(31,${38 + Math.random() * 8}%,${56 + Math.random() * 9}%)`;
      g.fillRect(x, r * rh, len, rh);
      g.fillStyle = "rgba(90,60,30,.35)"; g.fillRect(x, r * rh, 2, rh);
      x += len;
    }
    g.fillStyle = "rgba(90,60,30,.35)"; g.fillRect(0, r * rh, w, 1.5);
  }
  g.globalAlpha = 0.08;
  for (let i = 0; i < 700; i++) { g.fillStyle = Math.random() < 0.5 ? "#6b4a2b" : "#fff"; g.fillRect(Math.random() * w, Math.random() * h, 20 + Math.random() * 70, 1); }
});
// returns [day map, night emissive map] sharing one window grid; 8x8 cells so lit windows do not visibly repeat

    g.fillStyle = frame; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {

      const gr = g.createLinearGradient(0, y, 0, y + 46);
      const on = Math.random() < lit;
      cells.push([x, y, on || Math.random() < 0.42]);
      gr.addColorStop(0, on ? "#ffe9b0" : glassTop); gr.addColorStop(1, on ? "#f3c76b" : glassBottom);

// Everything that never moves is merged per (parent, material) so the scene stays cheap on phones.
const bake = new Map();
let XF = new THREE.Matrix4();
function at(x, y, z, yaw, fn) {
  const prev = XF;
  XF = prev.clone().multiply(new THREE.Matrix4().makeRotationY(yaw).setPosition(x, y, z));
  fn();
  XF = prev;
}
function worldUV(geo, su, sv = su) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i));
    if (ay > 0.5) uv.setXY(i, p.getX(i) / su, p.getZ(i) / su);
    else uv.setXY(i, (ax > 0.5 ? p.getZ(i) : p.getX(i)) / su, p.getY(i) / sv);
  }
}
function put(parent, geo, mat, x = 0, y = 0, z = 0, o = {}) {
  if (o.rx) geo.rotateX(o.rx);
  if (o.rz) geo.rotateZ(o.rz);
  if (o.ry) geo.rotateY(o.ry);
  geo.translate(x, y, z);
  geo.applyMatrix4(XF);
  if (o.uv) worldUV(geo, ...o.uv);
  const cast = o.cast ?? !(mat.transparent || mat.isMeshBasicMaterial);
  const key = parent.uuid + mat.uuid + cast;
  let e = bake.get(key);
  if (!e) bake.set(key, (e = { parent, mat, cast, geos: [] }));
  e.geos.push(geo.index ? geo.toNonIndexed() : geo);
}
const B = (p, w, h, d, mat, x, y, z, o) => put(p, new THREE.BoxGeometry(w, h, d), mat, x, y, z, o);
const C = (p, rt, rb, h, mat, x, y, z, o = {}) => put(p, new THREE.CylinderGeometry(rt, rb, h, o.seg || 18), mat, x, y, z, o);
const SP = (p, r, mat, x, y, z, o = {}) => put(p, new THREE.IcosahedronGeometry(r, o.detail ?? 1), mat, x, y, z, o);
const PL = (p, w, h, mat, x, y, z, o) => put(p, new THREE.PlaneGeometry(w, h), mat, x, y, z, o);

  for (const e of bake.values()) {
    const m = new THREE.Mesh(mergeGeometries(e.geos, false), e.mat);
    m.castShadow = e.cast; m.receiveShadow = !e.mat.transparent;
    if (e.mat.transparent) m.renderOrder = e.mat === MAT.ao ? 1 : 2; // contact shadows sit under the glass
    e.parent.add(m);

}

if (MOBILE) $("feedbox").classList.add("closed");
let lanDone = false;

addEventListener("resize", () => {

// ================= ambient pedestrians (decor only: not clickable, not part of the employee system) =================
// routes avoid benches, the fountain, lamp posts and street-tree trunks; lane = sideways offset so two-way flows pass
const PED_ROUTES = [
  [[-1, 43.6], [-1, 33], [2.75, 29.5], [2.75, 24.5], [-1, 21], [-1, 13.8], [41.6, 13.8], [41.6, 43.6], [-1, 43.6]],
  [[-4, 43.6], [-4, 33], [-7.75, 29.5], [-7.75, 24.5], [-4, 21], [-4, 13.8], [-41.6, 13.8], [-41.6, 43.6], [-4, 43.6]],
  [[-130, 59.5], [130, 59.5]], [[-130, 44.5], [130, 44.5]], [[-130, -37.5], [130, -37.5]],
  [[42.5, -130], [42.5, 130]], [[-42.5, -130], [-42.5, 130]], [[57.5, -130], [57.5, 130]],
].map(P => { const L = [0]; for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1])); return { P, L, len: L[L.length - 1], lane: P.length > 2 ? 0.25 : 0.9 }; });
const NPED = MOBILE ? 14 : 36;
const pedMesh = (geo, n) => { const m = new THREE.InstancedMesh(geo, M(0xffffff, { roughness: 0.8 }), n); m.frustumCulled = false; m.castShadow = !MOBILE; scene.add(m); return m; };
const pedBody = pedMesh(mergeGeometries([new THREE.CapsuleGeometry(0.19, 0.36, 3, 8).scale(1.1, 1, 0.8).translate(0, 1.17, 0), ...[-0.26, 0.26].map(x => new THREE.CapsuleGeometry(0.05, 0.44, 3, 6).translate(x, 1.12, 0))]), NPED);
const pedHead = pedMesh(new THREE.SphereGeometry(0.15, 12, 10).translate(0, 1.63, 0), NPED);
const pedHair = pedMesh(new THREE.SphereGeometry(0.16, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2).translate(0, 1.65, -0.01), NPED);
const pedLegs = pedMesh(new THREE.CapsuleGeometry(0.075, 0.62, 3, 6).translate(0, -0.39, 0), NPED * 2);
const SHIRTS = [0xf4f1ea, 0x2f3b4c, 0x8aa0b8, 0xc9b79c, 0x6b7f5e, 0xb5564b, 0x1f2a36, 0xe0c35a, 0x9a8fb5, 0xffffff, 0x3d6f9e];
const peds = Array.from({ length: NPED }, (_, i) => {
  const r = PED_ROUTES[i < NPED * 0.45 ? i % 2 : 2 + (i % 6)];
  pedBody.setColorAt(i, tc.set(pick(SHIRTS))); pedHead.setColorAt(i, tc.set(pick(SKIN))); pedHair.setColorAt(i, tc.set(pick(HAIR)));
  tc.set(pick(PANTS)); pedLegs.setColorAt(i * 2, tc); pedLegs.setColorAt(i * 2 + 1, tc);
  return { r, s: rand(0, r.len), dir: Math.random() < 0.5 ? 1 : -1, v: rand(1.0, 1.5), ph: rand(0, 6) };
});
const pm = new THREE.Matrix4(), pq = new THREE.Matrix4();
function tickPeds(dt) {
  peds.forEach((w, i) => {
    const R = w.r; w.s = (w.s + w.dir * w.v * dt + R.len) % R.len;
    let k = 0; while (R.L[k + 1] < w.s) k++;
    const [ax, az] = R.P[k], [bx, bz] = R.P[k + 1], sl = R.L[k + 1] - R.L[k], t = (w.s - R.L[k]) / sl;
    const ux = (bx - ax) / sl * w.dir, uz = (bz - az) / sl * w.dir, sw = Math.sin((w.ph += dt * w.v * 6));
    pm.makeRotationY(Math.atan2(ux, uz)).setPosition(ax + (bx - ax) * t - uz * R.lane, -0.2 + Math.abs(sw) * 0.03, az + (bz - az) * t + ux * R.lane);
    pedBody.setMatrixAt(i, pm); pedHead.setMatrixAt(i, pm); pedHair.setMatrixAt(i, pm);
    for (const s of [-1, 1]) pedLegs.setMatrixAt(i * 2 + (s > 0), pq.makeRotationX(sw * 0.5 * s).setPosition(s * 0.1, 0.86, 0).premultiply(pm));
  });
  for (const m of [pedBody, pedHead, pedHair, pedLegs]) m.instanceMatrix.needsUpdate = true;
}

// ================= time of day (viewer's local clock, or a preview preset) =================
// hour, sun elevation°, sun colour, sun intensity, hemi sky, hemi ground, hemi intensity, sky top, sky mid, sky low (= fog), exposure, night 0..1
const NIGHT_K = [40, 0x9db4e6, 0.22, 0x3d5580, 0x1a2029, 0.22, 0x050e22, 0x112546, 0x2a3a55, 0.95, 1];
const TOD = [
  [0, ...NIGHT_K], [4.8, ...NIGHT_K],
  [5.4, -3, 0xff9a70, 0.05, 0x6e8aaf, 0x3a3540, 0.42, 0x0f2148, 0x5a5878, 0xb98a8a, 0.95, 0.8], // first light (light swaps moon -> sun here)
  [6.0, 4, 0xffb184, 1.0, 0xbfd9f2, 0x786b61, 0.55, 0x354f80, 0xf3a985, 0xffe2be, 0.84, 0.35], // dawn
  [7.5, 20, 0xffe0bc, 2.2, 0xd8eafc, 0x9a8f7c, 0.68, 0x2f6fb5, 0xa6d0ef, 0xf1efe6, 0.84, 0],
  [12, 58, 0xfff5e7, 2.7, 0xe8f4ff, 0xa69b88, 0.8, 0x2b70b7, 0xa8d4f1, 0xedf6f6, 0.84, 0], // day
  [15.5, 36, 0xfff0dc, 2.5, 0xe4f0fb, 0xa69b88, 0.75, 0x2e72b8, 0xb0d6ef, 0xf0f2ec, 0.84, 0],
  [17.0, 14, 0xffb066, 2.2, 0xe6d3c0, 0xb08e6c, 0.6, 0x36547e, 0xf5b37b, 0xffe4bb, 0.84, 0.05], // golden hour
  [18.3, 1, 0xf48b6b, 0.7, 0x9a8aa8, 0x51454a, 0.4, 0x192c55, 0xab6c75, 0xdba6a1, 0.88, 0.6], // dusk
  [18.8, -3, 0xf08060, 0.05, 0x6e8aaf, 0x51454a, 0.42, 0x13254f, 0x7a5a78, 0xc08a8a, 0.92, 0.85], // last light (sun -> moon)
  [19.5, ...NIGHT_K], [24, ...NIGHT_K],
].map(k => k.map((v, i) => [2, 4, 5, 7, 8, 9].includes(i) ? new THREE.Color(v) : v));
const TOD_PRESET = { day: 13, dusk: 17.8, night: 21.5 };
let NIGHT = 0, envK = 1, todMode = "auto", todHour = -1, todNext = 0;
// warm interior light at night (no shadows); phones get two lights that each cover two floors
const NIGHT_LIGHTS = (MOBILE ? [2, 4] : [1, 2, 3, 4]).map(f => { const l = new THREE.PointLight(0xffd29a, 0, 26, 1); l.position.set(-1, fy(f) + 3.3, 0); scene.add(l); return l; });
const LED_DAY = new THREE.Color(0xe9edf1), LED_NIGHT = new THREE.Color(0xffd9a6).multiplyScalar(2.6), LAMP_DAY = new THREE.Color(0xc4c9cf), LAMP_NIGHT = new THREE.Color(0xffe2b0).multiplyScalar(2.2);
function applyTOD(h) {
  let i = 0; while (h > TOD[i + 1][0]) i++;
  const a = TOD[i], b = TOD[i + 1], k = (h - a[0]) / (b[0] - a[0]);
  const L = j => a[j] + (b[j] - a[j]) * k, LC = (c, j) => c.lerpColors(a[j], b[j], k);
  const up = h >= 5.4 && h < 18.8, az = up ? Math.PI * (0.1 + 0.8 * (h - 6) / 12) : 0.8, el = L(1) * Math.PI / 180, se = Math.max(el, 0.21); // rises ESE (+x), south (+z) at noon, sets WSW; shadows clamp at 12°
  sun.position.set(Math.cos(az) * Math.cos(se), Math.sin(se), Math.sin(az) * Math.cos(se)).multiplyScalar(100);
  LC(sun.color, 2); sun.intensity = L(3);
  LC(hemi.color, 4); LC(hemi.groundColor, 5); hemi.intensity = L(6);
  const U = sky.material.uniforms;
  LC(U.top.value, 7); LC(U.mid.value, 8); LC(U.low.value, 9); scene.fog.color.copy(U.low.value);
  U.sunDir.value.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
  U.sunCol.value.copy(sun.color).multiplyScalar(up ? 1 : 0.55);
  renderer.toneMappingExposure = L(10);
  NIGHT = U.night.value = L(11);
  MAT.led.color.lerpColors(LED_DAY, LED_NIGHT, NIGHT); MAT.lampHead.color.lerpColors(LAMP_DAY, LAMP_NIGHT, NIGHT);
  MAT.pool.opacity = NIGHT * 0.8; glowPts.material.opacity = NIGHT;
  for (const m of FACADES) m.emissiveIntensity = NIGHT * 1.3;
  cloudMat.emissiveIntensity = 0.35 * (1 - NIGHT) + 0.02;
  for (const l of NIGHT_LIGHTS) l.intensity = NIGHT * (MOBILE ? 26 : 20);
  const e = 1 - 0.72 * NIGHT; // keep the stonework readable under the warm night lighting
  if (Math.abs(e - envK) > 0.02) { envK = e; scene.traverse(o => { const m = o.material; if (m && m.isMeshStandardMaterial) { m.userData.env ??= m.envMapIntensity; m.envMapIntensity = m.userData.env * e; } }); }
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  $("clock").textContent = `${NIGHT > 0.6 ? "🌙" : h > 16.5 || h < 7.5 ? "🌇" : "☀️"} ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}
function tickTOD(dt) {
  const d0 = new Date(), target = todMode === "auto" ? d0.getHours() + d0.getMinutes() / 60 : TOD_PRESET[todMode];
  if (todHour < 0) todHour = target;
  const d = ((target - todHour + 36) % 24) - 12; // shortest way round the clock, so presets play as a short time-lapse
  if (Math.abs(d) > 0.01) todHour = (todHour + d * Math.min(1, dt * 2.5) + 24) % 24;
  else if (now < todNext && envK >= 0) return; // settled: refresh once a second
  else todHour = target;
  todNext = now + 1;
  applyTOD(todHour);
}
document.querySelectorAll("[data-tod]").forEach(b => (b.onclick = () => { todMode = b.dataset.tod; document.querySelectorAll("[data-tod]").forEach(x => x.classList.toggle("on", x === b)); }));

// Optional scenic rain, simulated locally. One small line buffer; no network, weather or location access.
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let weatherMode = "sun", effectsEnabled = !reducedMotion.matches;
const RAIN_COUNT = MOBILE ? 130 : 360, rainPositions = new Float32Array(RAIN_COUNT * 6);
for (let i = 0; i < RAIN_COUNT; i++) {
  let x, z;
  do { x = rand(-58, 58); z = rand(-48, 58); } while (Math.abs(x) < HW + 3 && Math.abs(z) < HD + 5);
  const j = i * 6, y = rand(0, 36);
  rainPositions.set([x, y, z, x + 0.08, y + 0.6, z], j);
}
const rainGeometry = new THREE.BufferGeometry();
rainGeometry.setAttribute("position", new THREE.BufferAttribute(rainPositions, 3));
const rain = new THREE.LineSegments(rainGeometry, new THREE.LineBasicMaterial({ color: 0xa5c9dd, transparent: true, opacity: 0.5, depthWrite: false }));
rain.visible = false; rain.frustumCulled = false; scene.add(rain);
function syncLandscapeControls() {
  document.querySelectorAll("[data-weather]").forEach(b => { const on = b.dataset.weather === weatherMode; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  const enabled = effectsEnabled && !reducedMotion.matches;
  $("landscape-fx").classList.toggle("on", enabled);
  $("landscape-fx").setAttribute("aria-pressed", String(enabled));
  $("landscape-fx").textContent = reducedMotion.matches ? "減少動態" : `景觀特效 ${enabled ? "開" : "關"}`;
  $("landscape-fx").disabled = reducedMotion.matches;
  $("landscape-fx").title = reducedMotion.matches ? "依系統減少動態設定暫停景觀動畫" : "關閉後暫停細雨、旗幟、雲層與水景動畫；保留員工工作模擬";
  rain.visible = weatherMode === "rain" && enabled;
}
function tickRain(dt) {
  if (!rain.visible) return;
  for (let i = 0; i < RAIN_COUNT; i++) {
    const j = i * 6;
    let y = rainPositions[j + 1] - dt * 14;
    if (y < 0) y += 36;
    rainPositions[j + 1] = y; rainPositions[j + 4] = y + 0.6;
  }
  rainGeometry.attributes.position.needsUpdate = true;
}
document.querySelectorAll("[data-weather]").forEach(b => (b.onclick = () => { weatherMode = b.dataset.weather; syncLandscapeControls(); }));
$("landscape-fx").onclick = () => { effectsEnabled = !effectsEnabled; syncLandscapeControls(); };
reducedMotion.addEventListener("change", e => { if (e.matches) effectsEnabled = false; syncLandscapeControls(); });
syncLandscapeControls();

// ================= loop =================
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let cardTick = 0;
function loop() {
  requestAnimationFrame(loop);
  step(Math.min(clock.getDelta(), 0.05));
}
window.__office = { step, people, cars: CARS }; // lets a test drive and inspect the simulation when the tab is throttled
function step(dt) {
  now += dt;
  if (built) {
    for (const c of CARS) updateCar(c, dt);
    for (const p of Object.values(people)) animatePerson(p, dt, now);
    tickConvs(); tickFlights();
  }
  tickTOD(dt); tickPeds(dt); tickRain(dt);
  if (effectsEnabled && !reducedMotion.matches) {
    revolver.rotation.y += dt * 0.35;
    jet.scale.y = 1 + Math.sin(now * 3) * 0.12;
    for (const fl of flags) fl.rotation.y = Math.sin(now * 2 + fl.position.x) * 0.25;
    for (const cl of clouds) { cl.position.x += dt * 2.5; if (cl.position.x > 600) cl.position.x = -600; }
  }
  for (const c of traffic) {
    c.pos += c.dir * c.speed * dt; if (c.pos > 320) c.pos = -320; if (c.pos < -320) c.pos = 320;
    if (c.horizontal) { c.g.position.set(c.pos, -0.15, c.lane); c.g.rotation.y = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
    else { c.g.position.set(c.lane, -0.15, c.pos); c.g.rotation.y = c.dir > 0 ? 0 : Math.PI; }
  }
  if (selected) {
    if (!selected.riding) { floors[selected.floor].group.add(ring); ring.position.set(selected.x, 0.03, selected.z); } else ring.visible = false;
    ring.visible = !selected.riding;
    if (follow) {
      selected.root.getWorldPosition(tmp); tmp.y += 1;
      const delta = tmp.clone().sub(controls.target).multiplyScalar(Math.min(1, dt * 3));
      controls.target.add(delta); camera.position.add(delta);
    }
    if ((cardTick += dt) > 0.5) { cardTick = 0; renderCard(); }
  }
  if (tween) {
    const k = Math.min(1, dt * 3);
    controls.target.lerp(tween.target, k); camera.position.lerp(tween.pos, k);
    if (camera.position.distanceTo(tween.pos) < 0.05) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
}
bakeAll(); // city & site
(function loop() { poll().finally(() => setTimeout(loop, STATIC ? 30000 : 1500)); })();
loop();
